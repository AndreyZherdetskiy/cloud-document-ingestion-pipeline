name: doc-pipeline

# Host .env is for Compose interpolation + host tools only — not env_file dump (C3).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"

x-app-runtime-env: &app-runtime-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  SQS_QUEUE_URL: http://localstack:4566/000000000000/dev-document-ingestion
  SQS_DLQ_URL: http://localstack:4566/000000000000/dev-document-ingestion-dlq
  SQS_PROCESSING_QUEUE_URL: http://localstack:4566/000000000000/dev-document-processing
  SQS_PROCESSING_DLQ_URL: http://localstack:4566/000000000000/dev-document-processing-dlq
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
  JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8000/dev-issuer}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-doc-pipeline}

services:
  # Stage 3: optional read replica NOT required. See docs/plans/stage3-read-replica.md (ADR-011).
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:8.10
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  localstack:
    build:
      context: ./infra/localstack
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      # Path-style queue URLs (http://host:4566/<account>/<name>) — matches Compose SQS_*_URL.
      SQS_ENDPOINT_STRATEGY: off
      # Docker-network SQS URLs — https://docs.localstack.cloud/aws/services/sqs/
      LOCALSTACK_HOST: localstack:4566
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      APP_ENV: ${APP_ENV}
      S3_BUCKET: ${S3_BUCKET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  otel-collector:
    build:
      context: ./infra/otel
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    # Distroless image inherits wget HEALTHCHECK — disable; probe via OTLP :4318 instead.
    healthcheck:
      disable: true
    depends_on:
      jaeger:
        condition: service_healthy
    logging: *default-logging

  prometheus:
    build:
      context: ./infra/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  grafana:
    build:
      context: .
      dockerfile: infra/grafana/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-runtime-env
      OTEL_SERVICE_NAME: doc-pipeline-api
      JWT_PUBLIC_KEY_PATH: ""
      JWT_PRIVATE_KEY_PEM: ""
      JWT_PRIVATE_KEY_PATH: ""
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    logging: *default-logging

  ingestion-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    command: [".venv/bin/python", "-m", "doc_pipeline.worker.ingestion_main"]
    restart: unless-stopped
    environment:
      <<: *app-runtime-env
      OTEL_SERVICE_NAME: doc-pipeline-ingestion-worker
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    logging: *default-logging

  processing-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    command: [".venv/bin/python", "-m", "doc_pipeline.worker.processing_main"]
    restart: unless-stopped
    environment:
      <<: *app-runtime-env
      OTEL_SERVICE_NAME: doc-pipeline-processing-worker
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    logging: *default-logging

  # Asyncio periodic scanner — separate process from ingestion/processing workers.
  stuck-scanner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    command: [".venv/bin/python", "-m", "doc_pipeline.worker.stuck_main"]
    restart: unless-stopped
    environment:
      <<: *app-runtime-env
      OTEL_SERVICE_NAME: doc-pipeline-stuck-scanner
      STUCK_JOB_OLDER_THAN_SECONDS: ${STUCK_JOB_OLDER_THAN_SECONDS:-1800}
      STUCK_SCAN_INTERVAL_SECONDS: ${STUCK_SCAN_INTERVAL_SECONDS:-60}
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    logging: *default-logging

networks:
  default:
    name: doc-pipeline

volumes:
  postgres-data:
    name: doc-pipeline-postgres-data
  grafana-data:
    name: doc-pipeline-grafana-data
