# Staging apply — manual only (workflow_dispatch).
# Auth: GitHub Actions OIDC → AWS IAM role (ADR-007).
# Do NOT store long-lived AWS access keys in GitHub Secrets.
name: terraform-apply-staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  apply-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      # OIDC example (uncomment on human GO with a real account):
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_TERRAFORM_STAGING_APPLY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      - name: Apply staging stub
        run: |
          echo "Staging apply stub — requires explicit human GO + OIDC role."
          echo "After apply: smoke GET /v1/health and /v1/ready."
          echo "No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in this workflow."
