# Characterization overlay only. Not default stack-up. Not spec §8 SLA.
services:
  api:
    environment:
      OTEL_SDK_DISABLED: "true"
      RATE_LIMIT_PER_MINUTE: "0"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
    command:
      [
        ".venv/bin/uvicorn",
        "doc_pipeline.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
  ingestion-worker:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
  processing-worker:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
  stuck-scanner:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
