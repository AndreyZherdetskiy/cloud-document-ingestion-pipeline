# Characterization overlay only. Not default stack-up. Not spec §8 SLA.
# Pool budget vs Postgres default max_connections=100 (do not raise max_connections):
# 4 api × (5+5) + 2 ingest × (3+2) + 2 processing × (3+2) + 1 stuck × (3+2) = 65.
services:
  api:
    environment:
      OTEL_SDK_DISABLED: "true"
      RATE_LIMIT_PER_MINUTE: "0"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command:
      [
        ".venv/bin/uvicorn",
        "doc_pipeline.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
  ingestion-worker:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "2"
      SQS_MAX_NUMBER_OF_MESSAGES: "10"
  processing-worker:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "2"
      SQS_MAX_NUMBER_OF_MESSAGES: "10"
  stuck-scanner:
    environment:
      OTEL_SDK_DISABLED: "true"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "2"
